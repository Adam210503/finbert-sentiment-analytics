services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: finbert-backend
    restart: unless-stopped
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    volumes:
      - finbert-data:/app/data
      - finbert-model:/app/training/finetuned_finbert
      - finbert-logs:/app/logs
    depends_on: []
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3; sqlite3.connect('data/sentiment_pipeline.db').execute('SELECT 1')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: finbert-api
    restart: unless-stopped
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    ports:
      - "8000:8000"
    volumes:
      - finbert-data:/app/data
      - finbert-model:/app/training/finetuned_finbert
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: finbert-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  finbert-data:
    driver: local
  finbert-model:
    driver: local
  finbert-logs:
    driver: local
